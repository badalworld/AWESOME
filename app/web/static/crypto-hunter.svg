<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Crypto Hunter</title>
  <desc id="desc">A market-tracking reticle around a rising price path.</desc>
  <defs>
    <linearGradient id="tile" x1="6" y1="3" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#163e38"/>
      <stop offset=".55" stop-color="#0c2425"/>
      <stop offset="1" stop-color="#101b2c"/>
    </linearGradient>
    <linearGradient id="trace" x1="15" y1="45" x2="49" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#37e2a1"/>
      <stop offset="1" stop-color="#9bf66b"/>
    </linearGradient>
    <linearGradient id="ring" x1="9" y1="12" x2="55" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ef0bd" stop-opacity=".9"/>
      <stop offset="1" stop-color="#78d8e9" stop-opacity=".45"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="19" fill="url(#tile)" stroke="#83f4c3" stroke-opacity=".28"/>
  <circle cx="32" cy="32" r="21" fill="#0a1a1c" fill-opacity=".58" stroke="url(#ring)" stroke-width="1.25" stroke-dasharray="85 10" transform="rotate(-28 32 32)"/>
  <path d="M14 24v-7h7M43 14h7v7M50 40v7h-7M21 50h-7v-7" fill="none" stroke="#9de9cd" stroke-opacity=".72" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
  <path d="M18 40.5 26.2 32l6.1 4.8L45.8 22" fill="none" stroke="url(#trace)" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.3" filter="url(#glow)"/>
  <path d="M38.8 21.8h7v7" fill="none" stroke="#a8ff71" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4"/>
  <circle cx="45.8" cy="22" r="2.6" fill="#d5ff87" stroke="#0b221d" stroke-width="1"/>
</svg>
